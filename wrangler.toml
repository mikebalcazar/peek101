# peek101 como Worker de Cloudflare. Decisiones D1 y D2 del arranque.
#
# Dos Workers con el mismo código: `peek101-staging`, que habla con la API de
# staging y sirve la org `demo`, y `peek101`, que habla con la de producción.
# El portal viejo (cuenta-taller101.netlify.app, contra Firestore) sigue vivo
# al lado hasta el corte (D3): esto no apaga nada.
#
# Las llaves no están aquí ni pueden estarlo: el despliegue lo hace el
# corredor con los secretos de Actions del repositorio.

name = "peek101"
main = "worker/index.js"
compatibility_date = "2026-09-01"

# Desde el 25-sep-2026 el portal vive también en peek101.taller101.com: el DNS
# de taller101.com está en Cloudflare (Mike lo movió ese día) y el Worker se
# cuelga del dominio como *custom domain*: Cloudflare pone el registro y el
# certificado; aquí no hay IPs. La dirección en workers.dev sigue viva.
# Con `routes` puesto, wrangler APAGA el subdominio workers.dev si no se le
# dice lo contrario (peek101 se quedó sin su dirección vieja un minuto el
# 25-sep: «error code: 1042»). Las dos direcciones se quedan.
workers_dev = true
routes = [
  { pattern = "peek101.taller101.com", custom_domain = true }
]

# La interfaz, tal cual está en `public/`: un HTML, un JS, un CSS y las
# fuentes. Sin empaquetador. `run_worker_first` deja que `/s101/*` llegue al
# Worker antes de que los assets contesten con un 404 o con el index.html.
[assets]
directory = "./public"
binding = "ASSETS"
not_found_handling = "404-page"
run_worker_first = ["/s101/*"]

# La API, desde el mismo origen. No hay URL: es un *service binding*, o sea
# una llamada de Worker a Worker que nunca sale a internet.
[[services]]
binding = "API"
service = "suite101-api"

[observability]
enabled = true

# ─────────────── staging ───────────────
# Es donde todo se prueba primero (D5), contra la org `demo` (D6).

[env.staging]
name = "peek101-staging"
# `routes` se hereda del nivel de arriba; staging NO se cuelga del dominio.
routes = []

[env.staging.assets]
directory = "./public"
binding = "ASSETS"
not_found_handling = "404-page"
run_worker_first = ["/s101/*"]

[[env.staging.services]]
binding = "API"
service = "suite101-api-staging"

[env.staging.observability]
enabled = true
