# Publica peek101 en Cloudflare y luego mide lo que publicó.
#
# El portal viejo (cuenta-taller101.netlify.app, contra Firestore) sigue vivo
# al lado hasta el corte (decisión D3): esto no apaga nada.
#
# El chat no alcanza api.cloudflare.com ni *.workers.dev: el proxy de salida
# se lo rechaza. Aquí sí hay internet, así que todo lo que hay que saber se
# mide aquí y se devuelve por el comentario del commit, que es el único canal
# de vuelta que el chat puede leer (OPERAR.md §6).
#
# Secretos del repositorio:
#   CLOUDFLARE_API_TOKEN    Workers Scripts:Edit, Account Settings:Read,
#                           User Details:Read
#   CLOUDFLARE_ACCOUNT_ID
#
# Variable del repositorio (no es un secreto, es un nombre de empresa):
#   ORG_PRODUCCION          qué empresa sirve el Worker de producción. Mientras
#                           no esté puesta SÓLO se publica staging, y es a
#                           propósito: a quién se le abre el portal lo decide
#                           Mike desde dash101 (fase 4 del arranque), y un
#                           portal de producción sin esa decisión no tiene a
#                           quién enseñarle nada.

name: Publicar el portal

on:
  push:
    branches: [main]
    paths-ignore:
      - 'claude/**'
      - '**.md'
  workflow_dispatch:

permissions:
  contents: write          # para dejar el comentario en el commit

concurrency:
  group: despliegue-peek101
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      ORG_PRODUCCION: ${{ vars.ORG_PRODUCCION }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci

      # Sin esto wrangler falla con un error de autenticación que no dice qué
      # hacer. Este paso sí lo dice, y el chat lo puede leer en el comentario
      # del commit: el chat no lista ni lee secretos, sólo pregunta si están.
      - name: Comprobar que hay con qué publicar
        run: |
          falta=""
          [ -n "${CLOUDFLARE_API_TOKEN:-}" ] || falta="$falta CLOUDFLARE_API_TOKEN"
          [ -n "${CLOUDFLARE_ACCOUNT_ID:-}" ] || falta="$falta CLOUDFLARE_ACCOUNT_ID"
          if [ -n "$falta" ]; then
            echo "::error::Faltan secretos del repositorio peek101:$falta. Los pone Mike en Settings ▸ Secrets and variables ▸ Actions; son los mismos que ya tienen suite101-api y dash101. El token necesita Workers Scripts:Edit, Account Settings:Read y User Details:Read."
            exit 1
          fi
          echo "los dos secretos están puestos"

      - name: Que el JavaScript compile y el reparto del Worker esté medido
        run: |
          set -euo pipefail
          for f in public/app.js public/textos.js worker/index.js scripts/*.mjs pruebas/*.mjs; do
            node --check "$f"
          done
          echo "todos los archivos pasan node --check"

      - name: Sellar la portada con este commit
        run: node scripts/sellar.mjs "${{ github.sha }}"

      # ── staging ──────────────────────────────────────────────────────────
      - name: Publicar staging
        id: staging
        run: |
          set -euo pipefail
          npx wrangler deploy --env staging | tee /tmp/staging.txt
          url=$(grep -oE 'https://[a-z0-9.-]+\.workers\.dev' /tmp/staging.txt | head -1)
          [ -n "$url" ] || { echo 'no pude sacar la liga de la salida de wrangler' >&2; exit 1; }
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "staging publicado: $url"

      - name: Medir staging
        id: medir_staging
        continue-on-error: true
        env:
          STAGING: ${{ steps.staging.outputs.url }}
          VERSION_ESPERADA: ${{ github.sha }}
        run: |
          set -u
          exec > >(tee /tmp/medido-staging.txt) 2>&1
          node scripts/medir.mjs

      - name: El portal manejado con un navegador, contra staging
        id: navegador
        continue-on-error: true
        env:
          BASE: ${{ steps.staging.outputs.url }}
        run: |
          set -u
          exec > >(tee /tmp/medido-navegador.txt) 2>&1
          npx playwright install --with-deps chromium
          node pruebas/portal.spec.mjs

      # Si algo falló, el mensaje del Worker vive en sus logs, y ahí sólo llega
      # este corredor. Se escucha con `wrangler tail` mientras se le vuelve a
      # pedir la portada, y lo que diga se pega a la medición.
      - name: Leer los errores del Worker de staging
        if: steps.medir_staging.outcome == 'failure' || steps.navegador.outcome == 'failure'
        env:
          STAGING: ${{ steps.staging.outputs.url }}
        run: |
          set -u
          {
            echo
            echo "== Lo que dice el Worker de staging (wrangler tail) =="
            npx wrangler tail peek101-staging --env staging --format json > /tmp/tail.jsonl 2>/tmp/tail.err &
            TAIL=$!
            sleep 8
            curl -s -o /dev/null -w 'GET /  → %{http_code}\n' "$STAGING/"
            curl -s -o /dev/null -w 'GET /s101/salud  → %{http_code}\n' "$STAGING/s101/salud"
            sleep 6
            kill $TAIL 2>/dev/null || true
            wait $TAIL 2>/dev/null || true
            python3 - <<'PY'
          import json
          vistos = 0
          try:
              for linea in open('/tmp/tail.jsonl'):
                  linea = linea.strip()
                  if not linea: continue
                  try: e = json.loads(linea)
                  except Exception: continue
                  vistos += 1
                  ev = e.get('event') or {}
                  print(f"-- {ev.get('request',{}).get('method','?')} {ev.get('request',{}).get('url','?')}  →  {e.get('outcome')}")
                  for x in e.get('exceptions', []):
                      print('   EXCEPCION:', x.get('name'), x.get('message'))
                      if x.get('stack'): print('   ', str(x['stack'])[:1500])
                  for l in e.get('logs', []):
                      print('   log', l.get('level'), ' '.join(str(m) for m in l.get('message', []))[:1500])
          except FileNotFoundError:
              pass
          if not vistos:
              print('(wrangler tail no entregó eventos)')
              try: print(open('/tmp/tail.err').read()[-1500:])
              except Exception: pass
          PY
          } >> /tmp/medido-staging.txt 2>&1
          tail -60 /tmp/medido-staging.txt

      - name: Que staging mande
        if: steps.medir_staging.outcome == 'failure' || steps.navegador.outcome == 'failure'
        run: exit 1

      # ── producción ───────────────────────────────────────────────────────
      # Sólo si staging salió bien y sólo si Mike ya dijo qué empresa sirve.
      - name: Sellar y publicar producción
        id: produccion
        if: env.ORG_PRODUCCION != ''
        run: |
          set -euo pipefail
          node scripts/sellar.mjs "${{ github.sha }}"
          npx wrangler deploy | tee /tmp/prod.txt
          url=$(grep -oE 'https://[a-z0-9.-]+\.workers\.dev' /tmp/prod.txt | head -1)
          [ -n "$url" ] || { echo 'no pude sacar la liga de la salida de wrangler' >&2; exit 1; }
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "producción publicada: $url"

      - name: Medir producción
        if: env.ORG_PRODUCCION != ''
        env:
          PROD: ${{ steps.produccion.outputs.url }}
          ORG_PROD: ${{ vars.ORG_PRODUCCION }}
          VERSION_ESPERADA: ${{ github.sha }}
        run: |
          set -u
          exec > >(tee /tmp/medido-prod.txt) 2>&1
          node scripts/medir.mjs

      - name: Decir que producción no se publicó, y por qué
        if: env.ORG_PRODUCCION == ''
        run: |
          echo "::notice::Sólo se publicó staging. El Worker de producción espera a que Mike decida a qué empresa sirve el portal (variable ORG_PRODUCCION del repositorio) y a quién se le abre, que se hace desde dash101."
          echo "Producción: no se publicó. Falta la variable ORG_PRODUCCION del repositorio." > /tmp/medido-prod.txt

      # Aquí está el canal de vuelta. El log de Actions no sirve: descargarlo
      # redirige a un host que el proxy del chat también rechaza.
      - name: Dejar lo medido en el commit
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          set -u
          : > /tmp/salida.txt
          for f in /tmp/medido-staging.txt /tmp/medido-navegador.txt /tmp/medido-prod.txt; do
            [ -f "$f" ] && cat "$f" >> /tmp/salida.txt
          done
          [ -s /tmp/salida.txt ] || echo "No hubo salida que reportar: el flujo se cayó antes de medir." > /tmp/salida.txt
          jq -Rs '{body: ("**peek101 como Worker**\n\n```\n" + .[-60000:] + "\n```")}' /tmp/salida.txt > /tmp/comentario.json
          curl -sS -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$REPO/commits/$SHA/comments" \
            -d @/tmp/comentario.json -o /tmp/respuesta.json -w 'comentario: %{http_code}\n'
          head -c 200 /tmp/respuesta.json || true
